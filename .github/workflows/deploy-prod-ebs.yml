name: Deploy to PROD EBS

env:
  EB_PACKAGE_S3_BUCKET_NAME: "pianco-ebs-deploy"
  EB_APPLICATION_NAME: "pianco-webapp"
  EB_ENVIRONMENT_NAME: "Pianco-webapp-prod"
  AWS_REGION_NAME: "us-east-2"
  DEPLOY_PACKAGE_NAME: "pianco-webapp-prod-deploy-package-${{ github.sha }}.zip"
  ECR_REGISTRY: "385626522460.dkr.ecr.us-east-2.amazonaws.com"

on:
  workflow_dispatch:

jobs:
  CI-part:
    runs-on: ubuntu-latest
    environment: prod
    concurrency: prod
    steps:
      - name: Git clone our repo
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.MY_AWS_ACCES_KEY }}
          aws-secret-access-key: ${{ secrets.MY_AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION_NAME }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION_NAME }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/pianco/frontend:${{ github.sha }} -f Dockerfile .
          docker tag ${{ env.ECR_REGISTRY }}/pianco/frontend:${{ github.sha }} ${{ env.ECR_REGISTRY }}/pianco/frontend:latest
          docker push ${{ env.ECR_REGISTRY }}/pianco/frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/pianco/frontend:latest

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/pianco/backend:${{ github.sha }} -f backend.Dockerfile .
          docker tag ${{ env.ECR_REGISTRY }}/pianco/backend:${{ github.sha }} ${{ env.ECR_REGISTRY }}/pianco/backend:latest
          docker push ${{ env.ECR_REGISTRY }}/pianco/backend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/pianco/backend:latest

      - name: Generate docker-compose.yml from template
        run: |
          sed 's/IMAGE_TAG_PLACEHOLDER/${{ github.sha }}/g' docker-compose.yml.template > docker-compose.yml
          echo "Generated docker-compose.yml with image tag: ${{ github.sha }}"
          cat docker-compose.yml

      - name: Create ZIP deployment package
        run: zip -r ${{ env.DEPLOY_PACKAGE_NAME }} docker-compose.yml nginx.conf -x *.git* -x *Dockerfile* -x *docker-compose.prod.yml*

      - name: Copy deployment package to S3 Bucket
        run: aws s3 cp ${{ env.DEPLOY_PACKAGE_NAME }} s3://${{ env.EB_PACKAGE_S3_BUCKET_NAME }}/

      - name: Succeed CI part
        run: echo "Successfully finished CI part"

  CD-part:
    runs-on: ubuntu-latest
    needs: [CI-part]
    environment: prod
    concurrency: prod
    steps:
      - name: Configure my AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.MY_AWS_ACCES_KEY }}
          aws-secret-access-key: ${{ secrets.MY_AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION_NAME }}

      - name: Create new ElasticBeanstalk Application Version
        run: |
          aws elasticbeanstalk create-application-version \
          --application-name ${{ env.EB_APPLICATION_NAME }} \
          --source-bundle S3Bucket="${{ env.EB_PACKAGE_S3_BUCKET_NAME }}",S3Key="${{ env.DEPLOY_PACKAGE_NAME }}" \
          --version-label "Ver-${{ github.sha }}" \
          --description "CommitSHA-${{ github.sha }}"

      - name: Deploy new ElasticBeanstalk Application Version
        run: aws elasticbeanstalk update-environment --environment-name ${{ env.EB_ENVIRONMENT_NAME }} --version-label "Ver-${{ github.sha }}"

      - name: Wait for Environment to become Ready
        run: aws elasticbeanstalk wait environment-updated --environment-name ${{ env.EB_ENVIRONMENT_NAME }}

      - name: Succeed CD part
        run: echo "Successfully finished CD part"
