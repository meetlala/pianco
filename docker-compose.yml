version: '3.8'
services:
  nginx:
    image: 385626522460.dkr.ecr.us-east-2.amazonaws.com/nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    
  frontend:
    image: 385626522460.dkr.ecr.us-east-2.amazonaws.com/pianco/frontend:latest
    restart: always
    
  backend:
    image: 385626522460.dkr.ecr.us-east-2.amazonaws.com/pianco/backend:latest
    restart: always
    environment:
      - PORT=11088
